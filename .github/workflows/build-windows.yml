name: Build FilePilot for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build FilePilot.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FilePilot --icon assets/filepilot.ico --collect-all customtkinter main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FilePilot-Windows-EXE
          path: dist/FilePilot.exe
          if-no-files-found: error
