name: Build FilePilot for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build FilePilot.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name FilePilot --icon assets/filepilot.ico --collect-all customtkinter main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FilePilot-Windows-EXE
          path: dist/FilePilot.exe
          if-no-files-found: error
          retention-days: 30
